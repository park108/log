<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="park108.net is a personal journal of Jongkil Park the developer" />
	<meta name="robots" content="index, follow">
    <!-- frame-ancestors 는 meta 로 전달되면 명세상 무시된다 (브라우저 콘솔이
         "ignored when delivered via a meta element" 로 경고). 여기 적어두면
         클릭재킹 방어가 있는 것처럼 읽히지만 실제로는 없다. 이 지시어는 HTTP
         응답 헤더로만 유효하므로 CloudFront/S3 응답 헤더 정책에서 설정한다
         (저장소 밖 — CSP 헤더의 frame-ancestors 또는 X-Frame-Options: DENY). -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; connect-src 'self' https://*.execute-api.ap-northeast-2.amazonaws.com; img-src 'self' data: https://d0.awsstatic.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net; object-src 'none'; base-uri 'self'; form-action 'self';">
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-icon-precomposed.png" />
    <title>park108.net</title>
  </head>
  <body>
    <div class="div" id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
