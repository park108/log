<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="park108.net 은 개발자 박종길의 개인 기록장입니다" />
	<meta name="robots" content="index, follow">

    <!-- 링크 미리보기 (Open Graph / Twitter).
         이 태그들이 없던 동안 글 주소를 공유하면 미리보기가 제목도 설명도 그림도
         없이 나갔다 — 카카오톡·슬랙·트위터는 전부 이 표면을 읽는다.

         **글마다 다르게 만들 수는 없다.** 이 사이트는 클라이언트에서 렌더하므로
         크롤러가 받는 것은 이 정적 문서뿐이고, `setMetaDescription` 이 런타임에
         바꾸는 값은 JS 를 실행하지 않는 크롤러에게 도달하지 않는다. 글 단위
         미리보기가 필요하면 서버 렌더나 프리렌더가 선행 조건이다.

         `og:description` 은 위 `description` 과 같은 문장이어야 한다 — 두 벌을
         두면 한쪽만 고쳐져 검색 결과와 공유 미리보기가 서로 다른 말을 한다.
         `og:url` 의 도메인은 `common.getUrl()` 의 운영 도메인과 같아야 한다.
         두 정합 모두 `__tests__/link-preview-coherence` 가 지킨다. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="park108.net" />
    <meta property="og:title" content="park108.net" />
    <meta property="og:description" content="park108.net 은 개발자 박종길의 개인 기록장입니다" />
    <meta property="og:url" content="https://www.park108.net/" />
    <meta property="og:image" content="https://www.park108.net/og-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <!-- 카드 종류와 그림 종횡비는 한 벌로 움직인다. 1.91:1 그림에 `summary` 를
         쓰면 미리보기가 가운데를 정사각으로 잘라내 효과가 상쇄된다. -->
    <meta name="twitter:card" content="summary_large_image" />
    <!-- frame-ancestors 는 meta 로 전달되면 명세상 무시된다 (브라우저 콘솔이
         "ignored when delivered via a meta element" 로 경고). 여기 적어두면
         클릭재킹 방어가 있는 것처럼 읽히지만 실제로는 없다. 이 지시어는 HTTP
         응답 헤더로만 유효하므로 CloudFront/S3 응답 헤더 정책에서 설정한다
         (저장소 밖 — CSP 헤더의 frame-ancestors 또는 X-Frame-Options: DENY). -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; connect-src 'self' https://*.execute-api.ap-northeast-2.amazonaws.com https://*.s3.ap-northeast-2.amazonaws.com; img-src 'self' data: https://d0.awsstatic.com https://*.s3.ap-northeast-2.amazonaws.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net; object-src 'none'; base-uri 'self'; form-action 'self';">
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-icon-precomposed.png" />
    <title>park108.net</title>
  </head>
  <body>
    <div class="div" id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
