name: ci

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # check:commit-writer-coherence 는 `git log -1 --name-only HEAD` 로 커밋의
          # 변경 path 를 읽는다. 기본 fetch-depth=1 은 부모가 없어 git 이 HEAD 를 root
          # commit 으로 보고 저장소 전체를 변경으로 출력하며, 그 결과 어떤 메시지 라벨도
          # cross-writer-mixing 이 된다. 부모 1개만 있으면 충분하다.
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check deps coherence
        run: npm run check:deps

      - name: Check Node version coherence
        run: npm run check:node-coherence

      - name: Check spec coherence
        run: npm run check:spec-coherence

      - name: Check package manager coherence
        run: npm run check:npm-coherence

      - name: Check dev port coherence
        run: npm run check:dev-port-coherence

      - name: Check build/coverage output dir coherence
        run: npm run check:build-coverage-coherence

      - name: Check vitest globals coherence
        run: npm run check:vitest-globals-coherence

      - name: Check CSS Modules coherence
        run: npm run check:css-modules-coherence

      - name: Check commit writer coherence
        run: npm run check:commit-writer-coherence

      - name: Check acceptance criteria
        run: npm run check:acceptance-criteria

      - name: Lint
        run: npm run lint

      - name: Check vite env boundary typing
        run: npm run check:vite-env

      # VITE_*_API_BASE 선언·실재 괴리 검증 (api-base-url-assembly-totality §동작 (A-5)).
      # src/types/env.d.ts 의 `readonly VITE_LOG_API_BASE: string` 은 **런타임 보장이
      # 아니다** — 키가 .env* 에 없거나 값이 비면 조립 결과는 "undefined/prod" 또는
      # "/prod" 가 된다. 도출 총성(check:api-base-url)이 성립해도 같은 결과에 도달하는
      # 두 번째 경로이고, tsc 는 선언을 참으로 가정하므로 이 괴리를 구조적으로 못 본다.
      # 판정은 두 층이다: 키 행 실재는 커밋된 env 파일 전부, 값 실재는 템플릿
      # (*.example) 제외. 키·파일 목록은 하드코딩하지 않고 도출하며
      # (RULE-06 §열거 고정 금지) 도출이 공허하면 exit 2 로 구별해 실패시킨다.
      - name: Check env api base presence
        run: npm run check:env-api-base

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Monitor 파생 state 불변 교체 게이트 (monitor §동작 G-1).
      # `useState` 바인딩의 in-place 변이는 갱신 경로가 잊은 필드를 초기값으로 은폐한다
      # — WebVitalsItem 헤더가 응답과 무관하게 영구 `(0)` 을 표시한 결함이 그 경로였다.
      # eslint 는 이 부류를 잡지 않고 테스트는 잊힌 필드를 단언하지 않으므로 정적 판정이
      # 유일한 발화 채널이다. 스캔 대상·검사 식별자는 하드코딩하지 않고 도출하며
      # (RULE-06 §열거 고정 금지) 대상 집합이 비면 공허 통과로 실패시킨다.
      - name: Check Monitor derived state immutability
        run: npm run check:monitor-state-immutability

      # 테스트 더블 반환 형상 정합 게이트 (test-double-return-shape-fidelity §동작 T-1).
      # 동기 술어 `(): boolean` 을 `mockResolvedValue` 로 대체하면 `Promise.resolve(false)`
      # 가 truthy 라 음성 케이스가 양성 분기를 실행한다 — 비-admin 차단 경로가 한 번도
      # 실행되지 않았고 요청 쿼리에 `[object Promise]` 가 직렬화된 결함이 그 경로였다.
      # **테스트는 이 축의 채널이 될 수 없다**: 위반은 테스트를 붉게 만들지 않고 오히려
      # 단언을 무력화해 초록을 만든다 (spec (R-5)). 그래서 정적 판정이 유일한 발화 채널이다.
      # 검사 술어·스캔 파일은 하드코딩하지 않고 도출하며 (RULE-06 §열거 고정 금지)
      # 대상 집합이 비면 공허 통과로 실패시킨다.
      - name: Check test double return shape fidelity
        run: npm run check:test-double-shape

      # 선언된 분기 구별 단언 게이트 (declared-branch-discriminating-assertion §동작 (B-1)).
      # 더블로 분기를 선택한 케이스는 그 선택이 여는 관측 결과를 구별하는 단언을 가져야 한다.
      # 위 형상 축(check:test-double-shape)이 선행 축이다 — 형상이 정합해야 분기가 비로소
      # 실행되고, 그 다음에야 단언의 구별력이 의미를 갖는다.
      # **테스트는 이 축의 채널이 될 수 없다**: 위반은 테스트를 붉게 만들지 않고 오히려
      # 초록을 만든다. 실측에서 분기 0회 실행과 1회 실행이 통과 수·분기 커버리지 모두
      # 완전히 동일했다 (677 passed · Branches 95.65%) — 커버리지 수치는 이 축의 신호가 아니다.
      # admin 항목명은 하드코딩하지 않고 Navigation.tsx 에서 도출하며 (RULE-06 §열거 고정 금지)
      # 도출이 0 이면 위반(1)이 아니라 무판정(2)으로 실패시킨다.
      - name: Check declared branch discrimination
        run: npm run check:branch-discrimination

      # 게이트 주입 seam 커버리지 (gate-judgement-population-injectable-seam §수용 기준 (E-1)(E-3)(E-4)).
      # 게이트 **자신의 인터페이스**를 판정한다 — check:* 중 이 축을 재는 것이 이것 하나다.
      # 이 게이트가 없던 기간에는 누군가 ENV_PRESENCE_SCAN_ROOT seam 을 지워도 pre-commit·CI 가
      # 전부 초록이었다. seam 이 사라지면 `RULE-06 §게이트 실효 검증` 의 주입 왕복이 불가능해져
      # **민감도 검증 능력 자체**가 사라진다 (TSK-20260825-28 이 그 부재로 blocked 됐다).
      # 게이트 목록은 하드코딩하지 않고 glob 으로 도출하며 (RULE-06 §열거 고정 금지)
      # 도출이 0 이면 위반(1)이 아니라 무판정(2)으로 실패시킨다.
      - name: Check gate seam coverage
        run: npm run check:gate-seam

      # api base URL 도출 총성 게이트 (api-base-url-assembly-totality §동작 (A-1)(A-3)(A-4)).
      # 미정의 base 가 `undefined + "?limit=10"` → 문자열 `"undefined?limit=10"` 이라는
      # **상대 URL** 로 조립돼 자기 origin 에 요청이 나가고, SPA 폴백이 index.html 을 200 으로
      # 돌려주면 뒤따르는 res.json() 이 파싱 오류로 깨진다 — 요청 실패가 아니라 잘못된 성공이다.
      # **테스트도 tsc 도 이 축의 채널이 아니다**: tsconfig 의 checkJs:false 라 .js 도출부는
      # 타입 검사 밖이고, 호출부가 fetch rejection 을 삼켜 실측 4회 유출에도 스위트는 초록이었다.
      # 그래서 정적 판정이 유일한 발화 채널이다.
      # 스캔 파일은 하드코딩하지 않고 도출하며 (RULE-06 §열거 고정 금지) 도출 지점이
      # 0 이면 공허 통과로 실패시킨다.
      - name: Check api base URL derivation totality
        run: npm run check:api-base-url

      # 커버리지 per-file 분기 귀속 단조성 (coverage-per-file-attribution-monotonicity §동작 1-3).
      # 부분집합(샤드) 실행에서 covered 인 분기 슬롯은 전수 실행에서도 covered 여야 한다.
      # 이 계약이 깨지면 Test(:72) 의 threshold 판정 자체가 집계 경로의 함수가 되지만,
      # 커버리지 수치는 게이트의 출력이라 어떤 상위 채널도 이를 신고하지 않는다.
      # vitest 를 전수 1회 + 샤드 N회 구동하므로 npm test 본체에 인라인하지 않고 분리한다.
      # 샤드 목록은 하드코딩하지 않는다 (RULE-06 §열거 고정 금지) — vitest 자신의 수집
      # 목록에서 도출하고, 열거 합이 전수 수집 수와 어긋나면 실패시킨다.
      - name: Check coverage per-file attribution monotonicity
        run: npm run check:coverage-attribution

      - name: Build
        run: npm run build

      # build 산출물 조건부 픽스처(3 상태 판정 · TSK-20260824-08-a)는 산출물이
      # 디스크에 있어야 측정된다. Test(:72) 시점에는 build/ 가 gitignored 라 부재하고
      # 전량 skip 으로 계수된다 — 검출력 0. Build 뒤에서 1회 실측한다.
      # 대상 목록은 하드코딩하지 않는다 (RULE-06 §열거 고정 금지) — 진입점이
      # vite outDir + 헬퍼 import + build 경로 표현으로 도출하고, 미측정(skip)이
      # 남으면 실패시킨다.
      - name: Check build artifact fixtures measured
        run: npm run check:build-artifact

      # ignores 5 패턴의 vacuous-zero 검사는 build/ 와 coverage/ 가 디스크에
      # 있어야 성립한다 (P-1 build/**, P-2 coverage/**). Test + Build 뒤에 둔다.
      - name: Check eslint ignores vacuous-zero
        run: npm run check:eslint-ignores-vacuous-zero
