name: ci

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # check:commit-writer-coherence 는 `git log -1 --name-only HEAD` 로 커밋의
          # 변경 path 를 읽는다. 기본 fetch-depth=1 은 부모가 없어 git 이 HEAD 를 root
          # commit 으로 보고 저장소 전체를 변경으로 출력하며, 그 결과 어떤 메시지 라벨도
          # cross-writer-mixing 이 된다. 부모 1개만 있으면 충분하다.
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check deps coherence
        run: npm run check:deps

      - name: Check Node version coherence
        run: npm run check:node-coherence

      - name: Check spec coherence
        run: npm run check:spec-coherence

      - name: Check package manager coherence
        run: npm run check:npm-coherence

      - name: Check dev port coherence
        run: npm run check:dev-port-coherence

      - name: Check build/coverage output dir coherence
        run: npm run check:build-coverage-coherence

      - name: Check vitest globals coherence
        run: npm run check:vitest-globals-coherence

      - name: Check CSS Modules coherence
        run: npm run check:css-modules-coherence

      - name: Check commit writer coherence
        run: npm run check:commit-writer-coherence

      - name: Check acceptance criteria
        run: npm run check:acceptance-criteria

      - name: Lint
        run: npm run lint

      - name: Check vite env boundary typing
        run: npm run check:vite-env

      # VITE_*_API_BASE 선언·실재 괴리 검증 (api-base-url-assembly-totality §동작 (A-5)).
      # src/types/env.d.ts 의 `readonly VITE_LOG_API_BASE: string` 은 **런타임 보장이
      # 아니다** — 키가 .env* 에 없거나 값이 비면 조립 결과는 "undefined/prod" 또는
      # "/prod" 가 된다. 도출 총성(check:api-base-url)이 성립해도 같은 결과에 도달하는
      # 두 번째 경로이고, tsc 는 선언을 참으로 가정하므로 이 괴리를 구조적으로 못 본다.
      # 판정은 두 층이다: 키 행 실재는 커밋된 env 파일 전부, 값 실재는 템플릿
      # (*.example) 제외. 키·파일 목록은 하드코딩하지 않고 도출하며
      # (RULE-06 §열거 고정 금지) 도출이 공허하면 exit 2 로 구별해 실패시킨다.
      - name: Check env api base presence
        run: npm run check:env-api-base

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Monitor 파생 state 불변 교체 게이트 (monitor §동작 G-1).
      # `useState` 바인딩의 in-place 변이는 갱신 경로가 잊은 필드를 초기값으로 은폐한다
      # — WebVitalsItem 헤더가 응답과 무관하게 영구 `(0)` 을 표시한 결함이 그 경로였다.
      # eslint 는 이 부류를 잡지 않고 테스트는 잊힌 필드를 단언하지 않으므로 정적 판정이
      # 유일한 발화 채널이다. 스캔 대상·검사 식별자는 하드코딩하지 않고 도출하며
      # (RULE-06 §열거 고정 금지) 대상 집합이 비면 공허 통과로 실패시킨다.
      - name: Check Monitor derived state immutability
        run: npm run check:monitor-state-immutability

      # 테스트 더블 반환 형상 정합 게이트 (test-double-return-shape-fidelity §동작 T-1).
      # 동기 술어 `(): boolean` 을 `mockResolvedValue` 로 대체하면 `Promise.resolve(false)`
      # 가 truthy 라 음성 케이스가 양성 분기를 실행한다 — 비-admin 차단 경로가 한 번도
      # 실행되지 않았고 요청 쿼리에 `[object Promise]` 가 직렬화된 결함이 그 경로였다.
      # **테스트는 이 축의 채널이 될 수 없다**: 위반은 테스트를 붉게 만들지 않고 오히려
      # 단언을 무력화해 초록을 만든다 (spec (R-5)). 그래서 정적 판정이 유일한 발화 채널이다.
      # 검사 술어·스캔 파일은 하드코딩하지 않고 도출하며 (RULE-06 §열거 고정 금지)
      # 대상 집합이 비면 공허 통과로 실패시킨다.
      - name: Check test double return shape fidelity
        run: npm run check:test-double-shape

      # 전역 원복 정적 게이트 (test-global-state-restoration-order-independence §동작 (FR-04)(NFR-02)).
      # 테스트가 window·navigator·globalThis 프로퍼티를 재정의하고 원복하지 않으면 그 상태는
      # 뒤 케이스로 누출돼 **실행 순서가 커버리지 수치를 바꾸는 채널**을 만든다.
      # **테스트는 이 축의 채널이 될 수 없다**: 단일 순서 1회 실행에서 위반은 초록이다.
      # 실측 — 원복 훅 0건 트리에서 base=139 / seed=138,138, 프로퍼티별 원복 등록 후
      # 140/140/140 으로 일치했고 통과 수는 양쪽 다 동일했다. 현행 커버리지 게이트는 전부
      # 단일 순서 1회 실행을 측정하므로 이 슬롯 이동을 구조적으로 보지 못한다.
      # 검출 단위는 파일이 아니라 재정의된 **프로퍼티**다 — 파일 단위 판정은 무관한 훅 1건의
      # 존재만으로 통과하므로 성기다. 복원은 afterEach/afterAll 훅 등록 블록 안에서만 계수하며
      # it 본문 직렬 호출을 등록으로 오인하지 않는다 (NFR-02).
      # 대상 파일·프로퍼티는 하드코딩하지 않고 도출하며 (RULE-06 §열거 고정 금지)
      # 도출이 0 이면 위반(1)이 아니라 무판정(2)으로 실패시킨다.
      - name: Check global state restoration
        run: npm run check:global-state-restoration

      # 선언된 분기 구별 단언 게이트 (declared-branch-discriminating-assertion §동작 (B-1)).
      # 더블로 분기를 선택한 케이스는 그 선택이 여는 관측 결과를 구별하는 단언을 가져야 한다.
      # 위 형상 축(check:test-double-shape)이 선행 축이다 — 형상이 정합해야 분기가 비로소
      # 실행되고, 그 다음에야 단언의 구별력이 의미를 갖는다.
      # **테스트는 이 축의 채널이 될 수 없다**: 위반은 테스트를 붉게 만들지 않고 오히려
      # 초록을 만든다. 실측에서 분기 0회 실행과 1회 실행이 통과 수·분기 커버리지 모두
      # 완전히 동일했다 (677 passed · Branches 95.65%) — 커버리지 수치는 이 축의 신호가 아니다.
      # admin 항목명은 하드코딩하지 않고 Navigation.tsx 에서 도출하며 (RULE-06 §열거 고정 금지)
      # 도출이 0 이면 위반(1)이 아니라 무판정(2)으로 실패시킨다.
      - name: Check declared branch discrimination
        run: npm run check:branch-discrimination

      # 게이트 주입 seam 커버리지 (gate-judgement-population-injectable-seam §수용 기준 (E-1)(E-3)(E-4)).
      # 게이트 **자신의 인터페이스**를 판정한다 — check:* 중 이 축을 재는 것이 이것 하나다.
      # 이 게이트가 없던 기간에는 누군가 ENV_PRESENCE_SCAN_ROOT seam 을 지워도 pre-commit·CI 가
      # 전부 초록이었다. seam 이 사라지면 `RULE-06 §게이트 실효 검증` 의 주입 왕복이 불가능해져
      # **민감도 검증 능력 자체**가 사라진다 (TSK-20260825-28 이 그 부재로 blocked 됐다).
      # 게이트 목록은 하드코딩하지 않고 glob 으로 도출하며 (RULE-06 §열거 고정 금지)
      # 도출이 0 이면 위반(1)이 아니라 무판정(2)으로 실패시킨다.
      - name: Check gate seam coverage
        run: npm run check:gate-seam

      # 선언된 게이트의 발화 채널 총성 (declared-gate-firing-channel-totality §동작 (FR-01)…(FR-07)).
      # 게이트는 **선언되는 것으로 존재하지 않는다** — 아무도 부르지 않으면 종수만 는다.
      # npm script + 스크립트 파일만 추가한 커밋이 이 워크플로와 훅을 건드리지 않은 채
      # 착지했고, 그 게이트는 뒤이은 54 커밋 동안 한 번도 실행되지 않았다. 그 사이 어떤
      # 기존 게이트도 붉어지지 않는다: 파일도 seam 도 npm 진입점도 정상이고 배선만 없기
      # 때문이다. 하필 그것이 측정 귀속 래퍼여서 거짓 양성 오보를 막을 채널이 잠들어 있었다.
      # 관측 표면은 주석 절단 후 **실행 라인**이다 — 주석에 적힌 게이트 이름은 채널이 아니다.
      # 대상 키·훅 파일은 하드코딩하지 않고 열거로 도출하며 (RULE-06 §열거 고정 금지)
      # 도출이 0 이면 위반(1)이 아니라 무판정(2)으로 실패시킨다.
      - name: Check declared gate firing channel
        run: npm run check:gate-firing-channel

      # 게이트 배선 실행 표면 정합 (gate-wiring-execution-surface-coherence §동작 FR-01·FR-02·FR-03·FR-05).
      # package.json check:* · .husky/pre-commit · scripts/** 3자의 배선 정합을 잰다.
      # 위 총성 축(check:gate-firing-channel)이 "채널이 1개라도 있는가" 를 재는 데 비해
      # 이 축은 "그 채널이 실행 표면에서 정합한가" 를 잰다 — 별 키다.
      # 이 축의 판정은 지금까지 spec 본문의 일회용 node -e 명령으로만 존재했다. 상시 채널이
      # 없으므로 (1) 훅의 게이트 호출 실행 라인이 삭제되고 설명 주석만 남는 형태와
      # (2) 훅 호출과 npm script 의 경로 분기가 로컬 커밋·CI 어디에서도 붉어지지 않았다.
      # 관측 표면은 주석 절단 후 **실행 라인**이다 — 주석에만 남은 스크립트 경로는 배선이
      # 아니라 위반이다. 절단하지 않으면 이 게이트는 자기가 겨누는 결함을 자기가 재현한다.
      # 대상 키·경로는 하드코딩하지 않고 열거로 도출하며 (RULE-06 §열거 고정 금지)
      # 도출이 0 이면 통과(0)가 아니라 무판정(2)으로 실패시킨다.
      - name: Check gate wiring coherence
        run: npm run check:gate-wiring

      # 정체 판정 계측 라인의 타입 계약 (stall-telemetry-schema-contract §동작 (T-1)(T-3)(T-4)).
      # `RULE-03` (S1)(S2)(S3) 는 판정을 `.claude/reports/<agent>.ndjson` 의 moved·streak 에
      # 전적으로 위임하는데 그 타입을 보는 채널이 없었다. 손상은 **유효한 JSON** 이라 파싱도
      # 통과한다 — 실측 114 라인 중 스키마 위반 7건 / 파싱 실패 0건. JS 에서 배열 > 0 은 NaN
      # 비교로 false 라 생산적 tick 이 조용히 '진행 0' 이 되고, 귀결은 정상 에이전트의 거짓
      # 정지다. stall lock 은 운영자만 지울 수 있어 자동 복구 경로가 없다.
      # **판정 모집단은 픽스처다**: .claude/reports/ 는 gitignored 라 상시 채널이 볼 수 없고,
      # 그것을 모집단으로 삼으면 파일 부재를 위반이 아니라 통과로 읽는다(false-negative).
      # 판정 필드는 하드코딩 개수가 아니라 SCHEMA 표 순회로 도출하며 (RULE-06 §열거 고정 금지)
      # 루트 부재는 통과(0)가 아니라 무판정(2)으로 실패시킨다 — 루트 실재·파일 0 은 0 이다.
      - name: Check stall telemetry line schema
        run: npm run check:telemetry-schema

      # 도구 출력 판독의 색상 비종속·fail-closed (gate-output-parsing-color-independent-fail-closed
      # §동작 FR-01·FR-02·FR-03·FR-04·FR-06·FR-07).
      # 게이트가 다른 도구 출력을 패턴으로 판독할 때 그 판정이 호출 환경의 색상 설정에 무너지면
      # 결과는 초록인 채 검출력만 사라진다 — 실측: FORCE_COLOR=1 하에서 check:deps 가
      # 'syntax error: operand expected' 를 내면서도 (PASS) rc=0 이었고 무색 실행과 rc 가 같아
      # CI 조차 붉어지지 않았다. 즉 이 붕괴의 발화 채널은 기존 어디에도 없었다.
      # 모집단은 package.json 의 check:* 키에서 도출하며 개수를 박제하지 않는다
      # (RULE-06 §열거 고정 금지) — 판독 게이트 도출이 0 이면 통과(0)가 아니라 무판정(2)이다.
      - name: Check output parsing color independence
        run: npm run check:output-parsing-color-independence

      # 측정 귀속 래퍼 자신의 발화 채널 (measurement-tree-attribution §동작 (M-6)).
      # 인자 없는 호출은 현 트리 지문 1줄을 내고 exit 0 이다 — 래퍼가 깨지거나 지문 산출이
      # 불가능해지면 exit 2 로 붉어진다. 위 총성 계약이 요구하는 채널 하한 1 을 이 step 이
      # 충족한다. **기존 step 을 이 래퍼로 감싸지 않는다**: `run:` 직후 키가 래퍼 이름으로
      # 바뀌어 감싸인 키가 채널 0 으로 전락한다. 래퍼의 채택률은 별 축이다.
      - name: Check measurement tree attribution
        run: npm run check:measurement-tree-attribution

      # task 발행 조건 주장의 비공허성 + 격리 사유서 처방 소비
      # (task-precondition-scope-nonvacuity-and-reason-consumption §동작 FR-01…FR-08).
      # 확인 범위가 측정 대상을 담지 못하는데 결과가 초록으로 읽히는 형태를 닫는다. 같은
      # 결합에서 이틀 연속 task 가 격리됐고 두 번째 격리는 첫 사유서가 앵커 문자열까지
      # 처방을 이미 갖고 있는 상태에서 났다 — 손실의 원인은 정보 부족이 아니라 미소비다.
      # 근거는 오류 비용의 비대칭이다: 범위가 좁으면 영 결과 -> 발행 -> 격리(세션 1개 소모),
      # 넓으면 적중 -> 보류(비용 없음). 기본값이 고비용 쪽에 놓여 있었다.
      # 판정 모집단은 픽스처다 — 실 대기열 두 곳이 .gitignore 대상이라 CI 체크아웃에
      # 존재조차 하지 않는다. 실 트리 판정은 seam 주입으로만 하는 로컬 진단이다.
      # 문서·마커는 하드코딩하지 않고 열거·조립으로 도출하며 (RULE-06 §열거 고정 금지)
      # 모집단이 비면 통과(0)가 아니라 무판정(2)으로 실패시킨다.
      - name: Check task precondition scope nonvacuity
        run: npm run check:task-precondition-scope

      # api base URL 도출 총성 게이트 (api-base-url-assembly-totality §동작 (A-1)(A-3)(A-4)).
      # 미정의 base 가 `undefined + "?limit=10"` → 문자열 `"undefined?limit=10"` 이라는
      # **상대 URL** 로 조립돼 자기 origin 에 요청이 나가고, SPA 폴백이 index.html 을 200 으로
      # 돌려주면 뒤따르는 res.json() 이 파싱 오류로 깨진다 — 요청 실패가 아니라 잘못된 성공이다.
      # **테스트도 tsc 도 이 축의 채널이 아니다**: tsconfig 의 checkJs:false 라 .js 도출부는
      # 타입 검사 밖이고, 호출부가 fetch rejection 을 삼켜 실측 4회 유출에도 스위트는 초록이었다.
      # 그래서 정적 판정이 유일한 발화 채널이다.
      # 스캔 파일은 하드코딩하지 않고 도출하며 (RULE-06 §열거 고정 금지) 도출 지점이
      # 0 이면 공허 통과로 실패시킨다.
      - name: Check api base URL derivation totality
        run: npm run check:api-base-url

      # 커버리지 per-file 분기 귀속 단조성 (coverage-per-file-attribution-monotonicity §동작 1-3).
      # 부분집합(샤드) 실행에서 covered 인 분기 슬롯은 전수 실행에서도 covered 여야 한다.
      # 이 계약이 깨지면 Test(:72) 의 threshold 판정 자체가 집계 경로의 함수가 되지만,
      # 커버리지 수치는 게이트의 출력이라 어떤 상위 채널도 이를 신고하지 않는다.
      # vitest 를 전수 1회 + 샤드 N회 구동하므로 npm test 본체에 인라인하지 않고 분리한다.
      # 샤드 목록은 하드코딩하지 않는다 (RULE-06 §열거 고정 금지) — vitest 자신의 수집
      # 목록에서 도출하고, 열거 합이 전수 수집 수와 어긋나면 실패시킨다.
      - name: Check coverage per-file attribution monotonicity
        run: npm run check:coverage-attribution

      # 커버리지 슬롯 집합 순서 무관성 (test-global-state-restoration-order-independence §동작 2 / FR-02).
      # 기본 순서 실행과 shuffle seed 실행이 **동일한 covered 슬롯 집합** 을 내야 한다.
      # 위 단조성 축(check:coverage-attribution)은 집계 경로를 재고 이 축은 실행 **순서** 를 잰다.
      # **개수는 이 축의 신호가 아니다**: 순서와 무관한 슬롯 1건의 교체는 집합을 바꾸면서 개수를
      # 보존하고(거짓 통과), cold-start 슬롯 1건의 증감은 집합 차이 없이 개수를 흔든다(거짓 위반).
      # 실측 — 개수 판정은 동일 HEAD 3회 호출에서 139/139/140 → 139/139/139 → 139/139/139 로 rc 가
      # 진동했다. 집합은 개수의 상위 개념이라 두 방향을 함께 닫는다.
      # **빈 집합 2개는 서로 같다** — 측정이 실패하면 비교가 자동 성립해 게이트가 초록이 되므로
      # 슬롯 도출 0·산출물 부재·대상 엔트리 부재는 통과(0)가 아니라 무판정(2)으로 실패시킨다.
      # 대상 파일 엔트리는 하드코딩하지 않고 접미사 매칭으로 도출하며 (RULE-06 §열거 고정 금지)
      # seed 목록도 주입 seam 이다. 커버리지를 3~4회 구동하므로 pre-commit 이 아니라 CI 에 둔다.
      - name: Check coverage slot set order invariance
        run: npm run check:coverage-slot-order-invariance

      - name: Build
        run: npm run build

      # build 산출물 조건부 픽스처(3 상태 판정 · TSK-20260824-08-a)는 산출물이
      # 디스크에 있어야 측정된다. Test(:72) 시점에는 build/ 가 gitignored 라 부재하고
      # 전량 skip 으로 계수된다 — 검출력 0. Build 뒤에서 1회 실측한다.
      # 대상 목록은 하드코딩하지 않는다 (RULE-06 §열거 고정 금지) — 진입점이
      # vite outDir + 헬퍼 import + build 경로 표현으로 도출하고, 미측정(skip)이
      # 남으면 실패시킨다.
      - name: Check build artifact fixtures measured
        run: npm run check:build-artifact

      # ignores 5 패턴의 vacuous-zero 검사는 build/ 와 coverage/ 가 디스크에
      # 있어야 성립한다 (P-1 build/**, P-2 coverage/**). Test + Build 뒤에 둔다.
      - name: Check eslint ignores vacuous-zero
        run: npm run check:eslint-ignores-vacuous-zero
