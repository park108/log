name: fixture-ci
# 아래 주석에 게이트 이름이 등장한다: npm run check:beta
# 주석은 채널이 아니다 (FR-03). 이 라인이 채널로 계수되면 hook-comment 변종이
# 조용히 rc=0 이 되어 주입이 무효가 된다.
on: [push]
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Alpha gate
        run: npm run check:alpha   # 후행 주석 — 절단 뒤에도 실행 라인은 남는다
      - name: Deeper indent noop
          run: echo "실행 라인이지만 게이트 호출은 없다"
      # 여기서 npm run check:gamma 를 부를 수도 있었다 — 주석은 채널이 아니다 (C-2a)
